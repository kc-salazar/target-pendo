[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "target-pendo"
version = "0.1.0"
description = "A reliable Singer target for loading visitor and account metadata into Pendo"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Carl Salazar" },
]
keywords = ["singer", "meltano", "pendo", "etl", "elt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "httpx>=0.28.1,<0.29",
  "singer-sdk==0.54.8",
]

[project.scripts]
target-pendo = "target_pendo.target:TargetPendo.cli"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.4,<10",
  "pytest-cov>=6.1",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/target_pendo"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=target_pendo --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["target_pendo"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["target_pendo"]
